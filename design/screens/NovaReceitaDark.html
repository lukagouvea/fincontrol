<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova transação — receita — escuro</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"><style>body{margin:0}a{color:inherit}</style></head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#121714;color:#edf1ee;font-family:'Inter',system-ui,sans-serif;overflow:hidden;padding:20px 20px 28px;gap:12px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="MainDark.html" aria-label="Fechar" style="width:44px;height:44px;border-radius:22px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px">Nova transação</h1>
    <div style="width:44px"></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:#2c352f">
    <button style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#c3ccc6;font-size:15px;font-weight:600;font-family:'Inter',system-ui,sans-serif">Despesa</button>
    <button style="min-height:44px;border-radius:12px;border:0;background:#1b221e;color:#5fc9a8;font-size:15px;font-weight:600;font-family:'Inter',system-ui,sans-serif">Receita</button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0">
    <label for="valor" style="font-size:14px;color:#9aa6a0">Valor</label>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;color:#9aa6a0">R$</span>
      <input id="valor" inputmode="decimal" value="12,40" style="width:190px;border:0;background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:44px;letter-spacing:-0.02em;color:#edf1ee;padding:0;outline:none">
    </div>
  </div>
  <div data-cats="1" style="display:flex;flex-direction:column;gap:8px">
    <div style="font-size:14px;font-weight:600">Categoria</div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button style="min-height:64px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;font-family:'Inter',system-ui,sans-serif"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>Salário</button>
      <button style="min-height:64px;border-radius:16px;border:2px solid #5fc9a8;background:#1d3a33;color:#5fc9a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;font-family:'Inter',system-ui,sans-serif"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/></svg>Cashback</button>
      <button style="min-height:64px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;font-family:'Inter',system-ui,sans-serif"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></svg>Reembolso</button>
      <button style="min-height:64px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;font-family:'Inter',system-ui,sans-serif"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Freelance</button>
      <button style="min-height:64px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;font-family:'Inter',system-ui,sans-serif"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Rendimentos</button>
      <button style="min-height:64px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;font-family:'Inter',system-ui,sans-serif"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>Outros</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="desc" style="font-size:14px;font-weight:600">Descrição</label>
      <input id="desc" value="Cashback Aurora" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#edf1ee">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:14px;font-weight:600">Data</span>
      <button style="min-height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:500;font-family:'Inter',system-ui,sans-serif">Hoje<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa6a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px">
    <div style="display:flex;align-items:center;gap:10px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58ad88" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/></svg>
      <div style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:600">Repetir todo mês</span><span style="font-size:12px;color:#9aa6a0">Desligado</span></div>
    </div>
    <button role="switch" aria-checked="false" aria-label="Repetir todo mês" style="width:52px;height:32px;border-radius:16px;border:0;background:#5a655e;padding:0;position:relative"><span style="position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#1b221e"></span></button>
  </div>
  <div style="flex:1"></div>
  <a href="MainDark.html" style="min-height:56px;border-radius:28px;background:#58ad88;color:#0e1a14;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;text-decoration:none">Salvar receita</a>
</div>

</body></html>
