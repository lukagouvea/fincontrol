name: CD

# Push/merge na main: testa tudo, publica as imagens e faz o deploy na VPS.
# Também pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches: [ "main" ]
    # Mudanças só de documentação não geram build nem deploy.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.env*.example'
      - 'teste_*.js'
      # Compose do banco (aplicado à mão na VPS do banco) e de dev: o CD não os usa.
      - 'docker-compose.prod.db.yml'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/backup.yml'
  workflow_dispatch:

# Deploys entram em fila e nunca são interrompidos no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-backend:
    uses: ./.github/workflows/_test-backend.yml

  test-frontend:
    uses: ./.github/workflows/_test-frontend.yml

  test-e2e:
    uses: ./.github/workflows/_test-e2e.yml

  # Roda em paralelo com os testes e publica só a tag do SHA, que é a usada pelo
  # deploy. Se um teste falhar, a imagem fica no registry mas nunca chega à VPS.
  build-and-push:
    uses: ./.github/workflows/_docker-build.yml
    with:
      push: true
      backend: true
      frontend: true
      latest: false
    secrets: inherit

  # Com os testes verdes, aponta a latest para as imagens deste commit (sem rebuild).
  tag-latest:
    name: Marcar latest
    needs: [ test-backend, test-frontend, test-e2e, build-and-push ]
    runs-on: ubuntu-latest
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Apontar latest para o SHA
        env:
          NS: ${{ secrets.DOCKER_USERNAME }}
        run: |
          for app in backend frontend; do
            docker buildx imagetools create \
              -t "$NS/fincontrol-$app:latest" "$NS/fincontrol-$app:$GITHUB_SHA"
          done

  deploy-vps:
    name: Deploy na VPS
    needs: [ test-backend, test-frontend, test-e2e, build-and-push ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SSH da VPS
        uses: ./.github/actions/vps-ssh
        with:
          ssh-key: ${{ secrets.VPS_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          user: ${{ secrets.VPS_USER }}

      # O compose vai com outro nome e só substitui o atual depois que o pull e o
      # backup derem certo (ver deploy/deploy.sh). Para rollback, rode de novo o job
      # "Deploy na VPS" de uma execução antiga: ele usa o SHA daquele commit.
      - name: Enviar arquivos de deploy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          scp docker-compose.prod.yml vps:fincontrol/docker-compose.next.yml
          scp deploy/deploy.sh deploy/backup-db.sh vps:fincontrol/

      - name: Executar deploy (pull, backup, up, health check)
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        # O SHA expande aqui no runner, de propósito.
        run: |
          # shellcheck disable=SC2029
          ssh vps "IMAGE_TAG=$GITHUB_SHA sh fincontrol/deploy.sh"
