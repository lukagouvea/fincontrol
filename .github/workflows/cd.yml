name: CD

# Push/merge na main: testa tudo, publica as imagens e faz o deploy na VPS.
# Também pode ser disparado manualmente pela aba Actions.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Deploys entram em fila e nunca são interrompidos no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-backend:
    uses: ./.github/workflows/_test-backend.yml

  test-frontend:
    uses: ./.github/workflows/_test-frontend.yml

  build-and-push:
    needs: [ test-backend, test-frontend ]
    uses: ./.github/workflows/_docker-build.yml
    with:
      push: true
      backend: true
      frontend: true
    secrets: inherit

  deploy-vps:
    name: Deploy na VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # A VPS não aceita SSH direto da internet: a conexão passa pelo
      # Cloudflare Tunnel e é autorizada no Cloudflare Access por um service token.
      - name: Instalar cloudflared
        run: |
          sudo curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Configurar SSH via Cloudflare Access
        env:
          SSH_KEY: ${{ secrets.VPS_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ssh-app.luka.dev.br
            User $VPS_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Executar Deploy Remoto
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          scp docker-compose.prod.yml vps:fincontrol/docker-compose.yml
          ssh vps 'cd fincontrol && docker compose pull && docker compose up -d && docker image prune -f'
