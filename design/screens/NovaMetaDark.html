<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova meta — escuro</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"><style>body{margin:0}a{color:inherit}</style></head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#121714;color:#edf1ee;font-family:'Inter',system-ui,sans-serif;overflow:hidden;padding:20px 20px 28px;gap:16px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="MetasDark.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:22px;border:1px solid #2c352f;background:#1b221e;color:#edf1ee;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px">Nova meta</h1>
    <div style="width:44px"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="nome" style="font-size:14px;font-weight:600">Nome da meta</label>
    <input id="nome" value="Reforma da casa" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#edf1ee">
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0">
    <label for="alvo" style="font-size:14px;color:#9aa6a0">Quanto você quer juntar</label>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:24px;color:#9aa6a0">R$</span>
      <input id="alvo" inputmode="decimal" value="10.000,00" style="width:220px;border:0;background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:44px;letter-spacing:-0.02em;color:#edf1ee;padding:0;outline:none">
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="prazo" style="font-size:14px;font-weight:600">Prazo</label>
      <input id="prazo" value="Jun de 2027" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#edf1ee">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="ja" style="font-size:14px;font-weight:600">Já guardado</label>
      <input id="ja" inputmode="decimal" value="R$ 0,00" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#edf1ee">
    </div>
  </div>
  <div style="background:#1f3a2f;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px">
    <div style="font-size:13px;color:#58ad88;font-weight:600">Para chegar lá</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:24px;color:#edf1ee">R$ 1.428,57 por mês</div>
    <div style="font-size:13px;color:#c3ccc6">Em 7 aportes, de dezembro a junho.</div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px">
    <div style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:600">Lembrar de guardar todo mês</span><span style="font-size:12px;color:#9aa6a0">Aviso no dia 5, quando o salário entra</span></div>
    <button role="switch" aria-checked="true" aria-label="Lembrar de guardar todo mês" style="width:52px;height:32px;border-radius:16px;border:0;background:#58ad88;padding:0;position:relative;flex:none"><span style="position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:12px;background:#1b221e"></span></button>
  </div>
  <div style="flex:1"></div>
  <a href="MetasDark.html" style="min-height:56px;border-radius:28px;background:#58ad88;color:#0e1a14;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;text-decoration:none">Criar meta</a>
</div>

</body></html>
