services:
  # --- BANCO DE DADOS ---
  db:
    image: postgres:18-alpine
    # Adicione este comando para limitar buffers
    # A VPS só tem 1GB de RAM
    command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c maintenance_work_mem=64MB -c work_mem=4MB -c wal_buffers=16MB    
    container_name: fincontrol-db-prod
    ports:
      # Só no IP da rede privada entre as VPS. Publicar em 0.0.0.0 expõe o banco à
      # internet, e o Docker ignora o ufw para portas publicadas.
      - '${POSTGRES_BIND_IP:?defina POSTGRES_BIND_IP com o IP privado desta VPS}:5432:5432'
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-fincontrol}
    volumes:
      # Postgres 18+ guarda os dados em /var/lib/postgresql/18/docker (PGDATA padrão da
      # imagem) e declara o volume em /var/lib/postgresql. Montar em .../data só
      # funcionava porque a imagem tem o symlink data -> . e deixava um volume anônimo
      # inútil por baixo. Os dados existentes já estão em <volume>/18/docker.
      - fincontrol-data-prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  fincontrol-data-prod: