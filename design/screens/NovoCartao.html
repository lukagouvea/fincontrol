<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo cartão</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"><style>body{margin:0}a{color:inherit}</style></head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F2EA;color:#16201C;font-family:'Inter',system-ui,sans-serif;overflow:hidden;padding:20px 20px 28px;gap:16px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="Cartoes.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:22px;border:1px solid #E6E1D5;background:#fff;color:#16201C;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px">Novo cartão</h1>
    <div style="width:44px"></div>
  </div>
  <div style="height:104px;box-sizing:border-box;border-radius:20px;background:#1E4D3B;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:15px;font-weight:600">Cartão Aurora</span><span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#2F6650">Crédito</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end"><span style="font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:16px;letter-spacing:0.12em">•••• 4821</span><span style="font-size:12px;color:#CFE2D8">Limite R$ 6.000,00</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="apelido" style="font-size:14px;font-weight:600">Apelido</label>
    <input id="apelido" value="Cartão Aurora" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #E6E1D5;background:#fff;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#16201C">
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="final" style="font-size:14px;font-weight:600">Final do cartão</label>
      <input id="final" inputmode="numeric" maxlength="4" value="4821" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #E6E1D5;background:#fff;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#16201C">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="limite" style="font-size:14px;font-weight:600">Limite</label>
      <input id="limite" inputmode="decimal" value="R$ 6.000,00" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #E6E1D5;background:#fff;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#16201C">
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="fecha" style="font-size:14px;font-weight:600">Fecha no dia</label>
      <input id="fecha" inputmode="numeric" value="8" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #E6E1D5;background:#fff;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#16201C">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="vence" style="font-size:14px;font-weight:600">Vence no dia</label>
      <input id="vence" inputmode="numeric" value="15" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #E6E1D5;background:#fff;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#16201C">
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="font-size:14px;font-weight:600">Cor</div>
    <div style="display:flex;gap:12px">
      <button aria-label="Verde, selecionado" style="width:44px;height:44px;border-radius:22px;border:3px solid #fff;box-shadow:0 0 0 2px #1E4D3B;background:#1E4D3B;padding:0"></button>
      <button aria-label="Azul" style="width:44px;height:44px;border-radius:22px;border:3px solid #F5F2EA;background:#2F5D8F;padding:0"></button>
      <button aria-label="Laranja" style="width:44px;height:44px;border-radius:22px;border:3px solid #F5F2EA;background:#B4531A;padding:0"></button>
      <button aria-label="Grafite" style="width:44px;height:44px;border-radius:22px;border:3px solid #F5F2EA;background:#2B3330;padding:0"></button>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#5B6660;line-height:1.4">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <span>Guardamos apenas os 4 últimos dígitos. O número completo e o código de segurança nunca são pedidos.</span>
  </div>
  <div style="flex:1"></div>
  <a href="Cartoes.html" style="min-height:56px;border-radius:28px;background:#1E4D3B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;text-decoration:none">Salvar cartão</a>
</div>

</body></html>
