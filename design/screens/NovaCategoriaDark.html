<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova categoria — escuro</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"><style>body{margin:0}a{color:inherit}</style></head><body>

<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#050806;font-family:'Inter',system-ui,sans-serif;color:#edf1ee;overflow:hidden">
  <a href="NovaDark.html" aria-label="Fechar" style="position:absolute;left:0;top:0;right:0;height:284px"></a>
  <div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;background:#121714;border-radius:28px 28px 0 0;padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px">
    <div style="align-self:center;width:40px;height:4px;border-radius:2px;background:#3b463f"></div>
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px">Nova categoria</h1>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:#2c352f">
      <button style="min-height:44px;border-radius:12px;border:0;background:#1b221e;color:#f08a4b;font-size:15px;font-weight:600;font-family:'Inter',system-ui,sans-serif">Despesa</button>
      <button style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#c3ccc6;font-size:15px;font-weight:600;font-family:'Inter',system-ui,sans-serif">Receita</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="nome" style="font-size:14px;font-weight:600">Nome</label>
      <input id="nome" value="Pets" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#edf1ee">
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:14px;font-weight:600">Ícone</div>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
        <button aria-label="Pata, selecionado" aria-pressed="true" style="min-height:44px;border-radius:12px;border:2px solid #58ad88;background:#1f3a2f;color:#58ad88;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="11" r="1.6"/><circle cx="10" cy="6.5" r="1.6"/><circle cx="14" cy="6.5" r="1.6"/><circle cx="18" cy="11" r="1.6"/><path d="M12 12c-3 0-5 2.5-5 5 0 2 1.5 3 3 3 1 0 1.5-.5 2-.5s1 .5 2 .5c1.5 0 3-1 3-3 0-2.5-2-5-5-5z"/></svg></button>
        <button aria-label="Livro" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5zM4 19.5V21h16"/></svg></button>
        <button aria-label="Presente" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2 0-4-1-4-3s3-2 4 3zM12 8c2 0 4-1 4-3s-3-2-4 3z"/></svg></button>
        <button aria-label="Viagem" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L3 11l7 3 3 7z"/></svg></button>
        <button aria-label="Café" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v6a4 4 0 01-4 4H8a4 4 0 01-4-4zM17 9h2a2 2 0 010 4h-2M7 3v2M11 3v2"/></svg></button>
        <button aria-label="Ferramenta" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l9-9M14 4a4 4 0 00-2 5l-1 1 3 3 1-1a4 4 0 005-2l-3 1-2-2 1-3z"/></svg></button>
        <button aria-label="Música" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13M9 18a3 3 0 11-3-3 3 3 0 013 3zM20 16a3 3 0 11-3-3 3 3 0 013 3z"/></svg></button>
        <button aria-label="Academia" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></button>
        <button aria-label="Roupas" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l-5 4 3 3 2-1v12h8V9l2 1 3-3-5-4a4 4 0 01-8 0z"/></svg></button>
        <button aria-label="Compras" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></svg></button>
        <button aria-label="Coração" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/></svg></button>
        <button aria-label="Lazer" aria-pressed="false" style="min-height:44px;border-radius:12px;border:1px solid #2c352f;background:#1b221e;color:#c3ccc6;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg></button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="limite" style="font-size:14px;font-weight:600">Limite mensal <span style="font-weight:500;color:#9aa6a0">(opcional)</span></label>
      <input id="limite" inputmode="decimal" placeholder="R$ 0,00" style="box-sizing:border-box;width:100%;height:52px;border-radius:16px;border:1px solid #2c352f;background:#1b221e;padding:0 16px;font-size:15px;font-family:'Inter',system-ui,sans-serif;color:#edf1ee">
      <span style="font-size:12px;color:#9aa6a0">Sem limite, a categoria mostra só o gasto e não entra no total do orçamento.</span>
    </div>
    <a href="NovaDark.html" style="min-height:56px;border-radius:28px;background:#58ad88;color:#0e1a14;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;text-decoration:none">Criar e usar</a>
  </div>
</div>

</body></html>
